[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# 用例与 fixture 共用同一个事件循环：aiomysql 连接池绑定事件循环，
# 跨循环复用会报 "Event loop is closed"（历史上踩过，见 docs/01 E-04）
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# 覆盖率门槛（V8）：业务服务层 app/services ≥ 80%
#   - 只统计业务服务层，不把路由/模型计入分母（口径与理由见 docs/09）
#   - skip-covered 让输出只列未覆盖文件，便于定位缺口
#   - 个别分支（LLM 异常兜底等）由 scripts/chaos_test.py 覆盖，不在单测里重复造
addopts =
    -q
    --cov=app.services
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
